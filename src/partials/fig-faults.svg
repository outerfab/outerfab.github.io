<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="Three electrical faults a test may check: open, short to ground, and short to a neighbouring pad"><text x="110" y="24" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="14" fill="#111111" text-anchor="middle" >open</text><rect x="20" y="60" width="26" height="26" fill="#F26A1B"/><rect x="170" y="66" width="16" height="14" fill="#5c6570"/><path d="M46 73L90 73M128 73L170 73" stroke="#111111" stroke-width="1.6"/><text x="109" y="58" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="16" fill="#111111" text-anchor="middle" >&#215;</text><text x="320" y="24" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="14" fill="#111111" text-anchor="middle" >short to ground</text><rect x="230" y="60" width="26" height="26" fill="#F26A1B"/><rect x="380" y="66" width="16" height="14" fill="#5c6570"/><path d="M256 73H380" stroke="#111111" stroke-width="1.6"/><path d="M318 73V118" stroke="#111111" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M250 118H396" stroke="#111111" stroke-width="3"/><text x="320" y="138" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#5c6570" text-anchor="middle" >ground</text><text x="530" y="24" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="14" fill="#111111" text-anchor="middle" >short to neighbour</text><rect x="440" y="60" width="26" height="26" fill="#F26A1B"/><rect x="590" y="66" width="16" height="14" fill="#5c6570"/><rect x="440" y="100" width="26" height="26" fill="#F26A1B"/><rect x="590" y="106" width="16" height="14" fill="#5c6570"/><path d="M466 73H590M466 113H590" stroke="#111111" stroke-width="1.6"/><path d="M528 73V113" stroke="#111111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="110" y="172" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#5c6570" text-anchor="middle" >the wire does not connect</text><text x="320" y="172" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#5c6570" text-anchor="middle" >the wire touches ground</text><text x="530" y="172" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#5c6570" text-anchor="middle" >two wires touch</text></svg>
