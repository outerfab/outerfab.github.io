<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 640 260" role="img" aria-label="Side view of the clearance zones around the bond pads: nothing within 2 millimetres, parts up to 1 millimetre tall from 2 to 5 millimetres, taller parts beyond"><rect x="130" y="60" width="80" height="140" fill="#F26A1B" fill-opacity=".14" stroke="#F26A1B" stroke-dasharray="4 4"/><rect x="210" y="60" width="120" height="140" fill="#5c6570" fill-opacity=".1" stroke="#5c6570" stroke-dasharray="4 4"/><rect x="20" y="200" width="610" height="8" fill="#111111"/><rect x="20" y="168" width="92" height="32" fill="#F26A1B"/><rect x="120" y="196" width="20" height="4" fill="#5c6570"/><path d="M112 168C112 130 130 130 130 196" fill="none" stroke="#111111" stroke-width="1.4"/><rect x="240" y="160" width="36" height="40" fill="#111111"/><rect x="390" y="130" width="80" height="70" fill="#111111"/><path d="M130 196L280 46" stroke="#5c6570" stroke-dasharray="2 4"/><text x="290" y="40" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#5c6570" text-anchor="start" >distance from the pads &#8805; height</text><text x="170" y="84" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#F26A1B" text-anchor="middle" >zone 1</text><text x="170" y="102" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#111111" text-anchor="middle" >nothing</text><text x="270.0" y="84" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#5c6570" text-anchor="middle" >zone 2</text><text x="270.0" y="102" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#111111" text-anchor="middle" >&#8804; 1 mm tall</text><text x="430" y="84" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#111111" text-anchor="middle" >beyond 5 mm</text><text x="430" y="102" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#111111" text-anchor="middle" >tall parts, kept back</text><path d="M130 210V220" stroke="#111111"/><text x="130" y="240" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#111111" text-anchor="middle" >0</text><path d="M210 210V220" stroke="#111111"/><text x="210" y="240" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#111111" text-anchor="middle" >2 mm</text><path d="M330 210V220" stroke="#111111"/><text x="330" y="240" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#111111" text-anchor="middle" >5 mm</text><text x="230.0" y="268" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="12" fill="#5c6570" text-anchor="middle" >measured outward from the outermost bond pad</text><text x="66" y="160" font-family="Outerfab Mono, ui-monospace, Menlo, monospace" font-weight="600" font-size="13" fill="#111111" text-anchor="middle" >die</text></svg>
