<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="{{color_scheme}}">
<meta property="og:site_name" content="Outerfab">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site_url}}/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Outerfab post-fab services for small silicon batches">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/outerfab-mono-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/outerfab-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css_file}}">
{{schema}}
{{page_head}}
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
{{header}}
<main id="main">
{{crumbs}}
{{body}}
</main>
{{footer}}
{{analytics}}

</html>
